[package]
name = "tn10"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Testnet-10 submission tool for the mass-limit checks (G1–G3).
# Not a default workspace member: `cargo test` does not build it.
# Run from crates/: cargo run -p tn10 -- <command>

[dependencies]
harness = { path = "../harness" }
lottery = { path = "../lottery" }
kaspa-consensus-core.workspace = true
kaspa-txscript.workspace = true
# M7 Stage 4 (spec D103): rebuild a real block's KIP-21 anchor proof from RPC.
kaspa-hashes.workspace = true
kaspa-seq-commit.workspace = true
kaspa-smt = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "01b532e8b553523216471682649693af92f0fd16" }
kaspa-addresses = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "01b532e8b553523216471682649693af92f0fd16" }
kaspa-rpc-core = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "01b532e8b553523216471682649693af92f0fd16" }
kaspa-wrpc-client = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "01b532e8b553523216471682649693af92f0fd16" }
secp256k1 = { version = "0.29.0", features = ["global-context", "rand-std"] }
tokio = { version = "1.42.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
# Front-end F0 (spec frontend 9): the wallet probe; serde_json at the version lottery pins.
# F1 part C: its Safe JSON (kaspa-consensus-client's, the format of kaspa-wasm's
# `Transaction.serializeToSafeJSON`) comes from `web::safe_json`, the one serialiser the page uses.
web = { path = "../web" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
blake2b_simd.workspace = true

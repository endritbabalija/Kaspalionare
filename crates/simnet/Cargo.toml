[package]
name = "simnet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Private simnet runner (M8 S4, spec A5b, D114, D125): an in-process rusty-kaspa v2.1.0 node
# on simnet with no peers, an on-demand miner, and (part 2) the anchor grinder and SN1-SN5.
# Not a default workspace member: `cargo test` never builds RocksDB.
# Build prerequisites (refs/rusty-kaspa-v2.1.0/README.md:71-78): LLVM/clang with
# LIBCLANG_PATH, and protoc (PROTOC or PATH). Run from crates/:
#   cargo run -j 2 -p simnet --release -- <subcommand>

[dependencies]
harness = { path = "../harness" }
lottery = { path = "../lottery" }
# The node itself (library `kaspad_lib`), pinned v2.1.0.
kaspad = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "01b532e8b553523216471682649693af92f0fd16" }
kaspa-alloc = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "01b532e8b553523216471682649693af92f0fd16" }
kaspa-core = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "01b532e8b553523216471682649693af92f0fd16" }
kaspa-utils = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "01b532e8b553523216471682649693af92f0fd16" }
kaspa-wrpc-server = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "01b532e8b553523216471682649693af92f0fd16" }
kaspa-consensus-core.workspace = true
kaspa-txscript.workspace = true
kaspa-hashes.workspace = true
kaspa-seq-commit.workspace = true
kaspa-smt = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "01b532e8b553523216471682649693af92f0fd16" }
kaspa-addresses = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "01b532e8b553523216471682649693af92f0fd16" }
kaspa-rpc-core = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "01b532e8b553523216471682649693af92f0fd16" }
kaspa-wrpc-client = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "01b532e8b553523216471682649693af92f0fd16" }
secp256k1 = { version = "0.29.0", features = ["global-context", "rand-std"] }
tokio = { version = "1.42.1", features = ["rt-multi-thread", "macros", "time"] }

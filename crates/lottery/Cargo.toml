[package]
name = "lottery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Off-chain protocol code: combinations, the counter tree, state encoders and the
# transaction builder. Covenants are compiled at test time through `harness`.

# D43 (spec M3): the TEST-ONLY seed drawer is built only with `test-seed` (default). A
# mainnet build must use `--no-default-features --features mainnet`; then no drawer exists.
# Enabling both is a compile error (lib.rs).
[features]
default = ["test-seed"]
test-seed = []
mainnet = []

[dependencies]
harness = { path = "../harness" }
kaspa-consensus-core.workspace = true
kaspa-txscript.workspace = true
silverscript-abi.workspace = true
blake2b_simd.workspace = true
blake3.workspace = true
secp256k1.workspace = true

[dev-dependencies]

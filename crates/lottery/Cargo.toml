[package]
name = "lottery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Off-chain protocol code: combinations, the counter tree, state encoders and the
# transaction builder. Covenants are compiled at test time through `harness`.

# Spec M7 D101: the `test-seed` feature and its compile_error! gate are deleted (the drawer
# has one entry, `draw()`, with the anchor proof). `mainnet` keeps the genesis network
# refusal (the drawer is deployed on testnet, devnet or the private simnet only until the
# release gate; mainnet is refused).
# Front-end F1 (spec frontend 6.1): `compiler` (default on) keeps the SilverScript compiler and
# the `.sil` source paths (template variants for the attack and mutant tests, the TEST-ONLY
# short-void drawer, `regen-templates`). Without it (the web build) the library uses the
# templates embedded from `templates/` and reads no file.
[features]
default = ["compiler"]
compiler = ["harness/compiler"]
mainnet = []

[[bin]]
name = "regen-templates"
required-features = ["compiler"]

[dependencies]
harness = { path = "../harness", default-features = false }
kaspa-consensus-core.workspace = true
kaspa-txscript.workspace = true
silverscript-abi.workspace = true
blake2b_simd.workspace = true
blake3.workspace = true
secp256k1.workspace = true
# Spec M8 A3, D121: the off-chain store formats (index/1, wallet/1, campaign/1, bundle/1).
# The versions already in Cargo.lock (rusty-kaspa links them); `kaspa_consensus_core::tx::Transaction`
# has its own serde implementation, used for the index log.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# M8 S2c (review MF-C): the index log stores each transaction as the hex of its Borsh
# serialization (the version already in Cargo.lock, the one rusty-kaspa's derives use).
borsh = "=1.8.1"

# Front-end F1: the wasm build. getrandom 0.3 (ahash, from kaspa-txscript's arkworks crates) has
# no wasm32-unknown-unknown backend unless `wasm_js` is on and `crates/.cargo/config.toml` sets
# its cfg; the version is the one already in Cargo.lock.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "=0.3.4", features = ["wasm_js"] }

[dev-dependencies]
# Spike VDF+ZK (docs/specs/spike-vdf.md): a local Groth16 prover over BN254 at the arkworks
# versions rusty-kaspa v2.1.0 links (workspace Cargo.toml, ark-* = "=0.6.0"), and the
# RISC Zero Groth16 receipt decoding SilverScript's own tests use (zk-sdk at SilverScript's
# rusty-kaspa rev a41a333). Test-only; nothing here reaches the library.
ark-bn254 = "=0.6.0"
ark-ff = "=0.6.0"
ark-groth16 = "=0.6.0"
ark-relations = "=0.6.0"
ark-serialize = "=0.6.0"
ark-snark = "=0.6.0"
ark-std = "=0.6.0"
kaspa-txscript-zk-sdk = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
risc0-zkvm = { version = "=3.0.4", default-features = false }
borsh = "1.7.0"

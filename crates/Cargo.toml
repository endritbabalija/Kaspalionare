[workspace]
members = ["harness", "lottery", "tn10", "simnet", "web", "indexer-api", "vendor/silverscript-abi"]
default-members = ["harness", "lottery"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "ISC"

[workspace.dependencies]
# rusty-kaspa: pinned release v2.1.0 (see docs/DECISIONS.md). Script engine and mass calculator.
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "01b532e8b553523216471682649693af92f0fd16" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "01b532e8b553523216471682649693af92f0fd16" }
kaspa-txscript-errors = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "01b532e8b553523216471682649693af92f0fd16" }
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "01b532e8b553523216471682649693af92f0fd16" }
# KIP-21 sequencing-commitment hashing (consensus/seq-commit); pins harness::ChainSim in tests (M7 SP11).
kaspa-seq-commit = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "01b532e8b553523216471682649693af92f0fd16" }
# SilverScript compiler v1.0.0. It links its own rusty-kaspa revision internally;
# only compiled bytecode crosses into the v2.1.0 engine above.
silverscript-lang = { git = "https://github.com/kaspanet/silverscript", rev = "3ed973335b59269293564805cc2c58a14595ec03" }
silverscript-abi = { git = "https://github.com/kaspanet/silverscript", rev = "3ed973335b59269293564805cc2c58a14595ec03" }
# Off-chain reference hashing for tests (same crates the script engine uses).
blake2b_simd = "1.0.2"
blake3 = "1.8.5"
# Test and probe keys (same version kaspa-consensus-core uses).
secp256k1 = { version = "0.29.0", features = ["global-context", "rand-std"] }

# Front-end F1 (spec frontend 6.1): one rusty-kaspa version. `silverscript-abi` (the ABI codec the
# builders use at run time) is a vendored copy of SilverScript v1.0.0's, built against v2.1.0 instead
# of SilverScript's rev a41a333 (two API changes; see vendor/silverscript-abi/Cargo.toml). It replaces
# the git crate everywhere, inside silverscript-lang included; the compiler itself still links a41a333
# and is native-only (`harness/compiler`). Byte identity: lottery/tests/f1_bytes.rs.
[patch."https://github.com/kaspanet/silverscript"]
silverscript-abi = { path = "vendor/silverscript-abi" }
